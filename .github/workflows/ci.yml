name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 22+ is required for --experimental-strip-types.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # pi-dcp declares @earendil-works/pi-coding-agent as a peer dependency.
      # package-lock.json pins the peer tree (pi-agent-core, pi-ai, pi-tui,
      # @types/node) hoisted at top level; installing @latest instead leaves
      # them nested where tsc and node cannot resolve them. Nothing actually
      # runs against pi in CI — we only verify tsc and unit tests.
      - name: Install dependencies
        run: |
          npm ci --silent
          npm install --no-save --silent typescript@latest

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: node --experimental-strip-types --test test/*.test.ts
